name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore test/JabuticabaTests/
    - name: Build
      run: dotnet build --no-restore -c Release src/Jabuticaba/
    - name: Test
      run: dotnet test --no-restore -c Release --verbosity normal test/JabuticabaTests/
    - name: Publish Nuget Package
      if: github.event_name == 'push'
      run: dotnet nuget push src/Jabuticaba/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
